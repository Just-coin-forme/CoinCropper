name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool libltdl-dev pkg-config \
            zlib1g-dev libncurses5-dev libffi-dev libssl-dev cmake zip unzip

      - name: Install buildozer
        run: pip install buildozer cython==0.29.36

      - uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Build APK
        run: buildozer -v android debug

      - uses: actions/upload-artifact@v4
        with:
          name: coincropper-apk
          path: bin/*.apk
